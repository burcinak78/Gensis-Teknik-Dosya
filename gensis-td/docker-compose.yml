# Local development stack: docker compose up --build
# Values come from .env (copy .env.example).
name: gensis-td

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROXY_PORT:-10201}:80"
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  # Next.js (pages, PDF routes). Talks to the backend inside the network; not published to the host.
  frontend:
    build: .
    image: gensis-td-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend

  # One-shot: migrations, app DB role, first admin. The only service with the DB owner password.
  migrate:
    build: ./backend
    image: gensis-td-backend:local
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Default: "Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};GSS Encryption Mode=Disable"
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  # Restricted DB role and MinIO key only (KRR-016).
  backend:
    build: ./backend
    image: gensis-td-backend:local
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=db;Database=${DB_NAME};Username=${DB_APP_USER};Password=${DB_APP_PASSWORD};GSS Encryption Mode=Disable"
      Auth__JwtSecret: ${JWT_SECRET}
      Auth__SecureCookie: ${SECURE_COOKIE:-true}
      Storage__Endpoint: http://storage:9000
      Storage__PublicUrl: ${STORAGE_PUBLIC_URL}
      Storage__AccessKey: ${MINIO_APP_USER}
      Storage__SecretKey: ${MINIO_APP_PASSWORD}
      GENSIS_COMPANY_ID: ${GENSIS_COMPANY_ID:-}
      # Password reset e-mail (Resend). Empty: "Şifremi unuttum" answers as usual but sends nothing.
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Email__From: ${EMAIL_FROM:-}
      App__PublicUrl: ${APP_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-10202}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine  # same major as Supabase (17.x)
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # not exposed to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  storage:
    # Official MinIO images are no longer published; Chainguard builds it from source.
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - storage-data:/data
    # S3 API only; the console port is not published.
    ports:
      - "127.0.0.1:${STORAGE_PORT:-10203}:9000"

  # One-shot: buckets and the backend's restricted key. Same image, which ships mc.
  storage-init:
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    entrypoint: ["/bin/bash", "/init/init.sh"]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
    volumes:
      - ./deploy/storage:/init:ro
    depends_on:
      - storage

volumes:
  db-data:
  storage-data:
