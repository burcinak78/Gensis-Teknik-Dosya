# Local development stack: docker compose up --build
# Values come from .env (copy .env.example).
name: gensis-td

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROXY_PORT:-10201}:80"
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      Auth__JwtSecret: ${JWT_SECRET}
      Auth__SecureCookie: ${SECURE_COOKIE:-true}
      Storage__Endpoint: http://storage:9000
      Storage__PublicUrl: ${STORAGE_PUBLIC_URL}
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-10202}:8080"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    # not exposed to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  storage:
    # Official MinIO images are no longer published; Chainguard builds it from source.
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - storage-data:/data
    # S3 API only; the console port is not published.
    ports:
      - "127.0.0.1:${STORAGE_PORT:-10203}:9000"
volumes:
  db-data:
  storage-data:
