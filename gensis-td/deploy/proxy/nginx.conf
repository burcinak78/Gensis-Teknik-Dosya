# Single entry point. TLS is terminated by Cloudflare Tunnel on the server, so this only speaks HTTP.
# Upstreams are resolved per request so the proxy starts even while a service is down.
resolver 127.0.0.11 valid=10s ipv6=off;

# Real client IP: Cloudflare Tunnel sets CF-Connecting-IP; without it (local) use the peer address.
# X-Forwarded-For is overwritten, not appended, so a client cannot inject its own value.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Locations that set their own add_header must repeat this one (nginx does not merge them).
    add_header X-Content-Type-Options nosniff always;

    # PDF generation stays in Next.js (react-pdf); every other /api/ path is the C# backend.
    location /api/pdf/ {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # KRR-020: API responses are data, never pages. (add_header here replaces the server-level one.)
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }
}
