# Single entry point. TLS is terminated by Cloudflare Tunnel on the server, so this only speaks HTTP.
# Upstreams are resolved per request so the proxy starts even while a service is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }
}
